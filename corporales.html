<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquillaje - Tienda de Belleza</title>
    <link rel="stylesheet" href="estilo/estilo.css">
    <style>
        /* Esta línea oculta el mensaje de "No hay productos disponibles" aunque el JS intente ponerlo */
        #contenedor-productos p { display: none !important; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">INICIO</a></li>
                <li class="dropdown">
                    <button class="dropbtn" aria-haspopup="true" aria-expanded="false">
                        CATÁLOGO ▾
                    </button>
                    <ul class="dropdown-content">
                        <li><a href="maquillaje.html">Maquillaje</a></li>
                        <li><a href="capilares.html">Capilares</a></li>
                        <li><a href="skin-care.html">Skin Care</a></li>
                        <li><a href="corporales.html">Corporales</a></li>
                    </ul>
                </li>
            </ul>

            <div class="nav-icons">
                <div class="search-box">
                    <input type="text" id="input-busqueda" placeholder="Buscar por producto o marca...">
                    <button class="search-btn" aria-label="Buscar">🔍</button>
                </div>
                
                <div class="cart-icon">
                    <button id="open-cart" class="icon-btn" aria-label="Ver carrito">
                        <img src="logos/carrito.png" alt="Carrito" class="cart-img-icon">
                        <span id="cart-count">0</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title" id="titulo-seccion">Corporales</h2>
        </div>
        
        <div id="contenedor-marcas" class="brands-grid" style="display: flex; gap: 20px; justify-content: center; margin-bottom: 40px;">
            
            <a href="fantinula.html" style="text-decoration: none; color: inherit; text-align: center; display: block;">
                <div class="brand-card" style="width: 200px;">
                    <div class="brand-img" style="height: 200px; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                        <img src="logos/fantiluna.jpeg" alt="fantiluna" style="width: 100%; height: 100%; object-fit: cover; border-radius: 15px;">
                    </div>
                    <p style="font-weight: bold; font-family: sans-serif;">Fantiluna →</p>
                </div>
            </a>

        </div>

        <div id="contenedor-productos" class="products-grid">
            <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
            <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
            <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
            <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
        </div>
    </main>

    <aside id="carrito-sidebar" class="cart-sidebar" aria-labelledby="cart-title">
        <div class="cart-header">
            <h2 id="cart-title">Tu carrito</h2>
            <button id="close-cart" class="close-btn" aria-label="Cerrar carrito">
                <img src="logos/cerrar.png" alt="Cerrar" class="close-cart-img">
            </button>
        </div>

        <div class="cart-labels">
            <span>PRODUCTO</span>
            <span>TOTAL</span>
        </div>

        <div class="cart-body">
            <div id="cart-items-container"></div>
        </div>

        <div class="cart-footer">
            <p class="delivery-warning">
                * El valor del domicilio es adicional y se coordina según tu ubicación.
            </p>
            <div class="total-estimated">
                <span>Total estimado</span>
                <span id="cart-total-amount">$0</span>
            </div>
            <button class="btn-checkout" id="btn-whatsapp">Terminar de comprar por WhatsApp</button>
        </div>
    </aside>

    <div id="cart-overlay" class="overlay"></div>

    <div id="modal-detalle" class="modal-overlay">
        <div class="modal-content detalle-container">
            <button id="btn-cerrar-detalle" class="close-btn-modal" aria-label="Cerrar detalle">×</button>
            <div class="detalle-grid">
                <div class="detalle-img">
                    <img id="detalle-foto" src="" alt="Cargando...">
                </div>
                <div class="detalle-info">
                    <h2 id="detalle-nombre"></h2>
                    <p class="detalle-marca" id="detalle-marca"></p>
                    <p class="detalle-descripcion" id="detalle-descripcion"></p>
                    <p class="detalle-precio" id="detalle-precio"></p>
                    <button id="btn-agregar-detalle" class="btn-checkout">Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Proyecto Universitario | Tienda de Belleza</p>
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
